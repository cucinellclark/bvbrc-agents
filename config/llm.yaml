# =============================================================================
# Shared LLM Configuration
# =============================================================================
# Only structural, request-agnostic settings live here.
#
# All model / URL / API-key details must arrive per request via `llm_override`
# (from the gateway, sourced from MongoDB's `modelList` collection). The
# orchestrator does not maintain a default chatbot model — a request without a
# complete `llm_override` is rejected with HTTP 400.
#
# The routing model (used only for internal JSON classification) is separate
# and is configured in `orchestrator/config/agents.yaml` under `orchestrator.
# routing_*`.
#
# Override precedence for the values below (highest wins):
#   1. Environment variables: LLM_TEMPERATURE, LLM_MAX_TOKENS,
#      LLM_TIMEOUT_SECONDS, LLM_CLASSIFIER_MODEL
#   2. This YAML file (or custom path via LLM_CONFIG_PATH env var)
#   3. Hardcoded fallback defaults in `llm_config.py`
# =============================================================================

llm:
  # Sampling temperature (0.0 = deterministic).
  temperature: 0.0

  # Cap on generated tokens when the request's llm_override does not supply
  # its own max_tokens. Thinking/reasoning models count reasoning tokens
  # against this budget; per-model overrides from MongoDB take precedence.
  max_tokens: 16384

  # Request timeout in seconds. Sized to accommodate thinking-model reasoning
  # and vLLM queue wait under load. Bumping the previous 60s here eliminated
  # retry storms on Qwen3-class models.
  timeout_seconds: 180

  # Optional lightweight classifier model used by the service agent to route
  # requests (plan vs submit vs status) before running the full pipeline.
  # When null, the request's own model is used for classification.
  # NOTE: there is no default endpoint — if you set this, also make sure the
  # request's llm_override (or a call-site override) supplies the endpoint.
  classifier_model: null
