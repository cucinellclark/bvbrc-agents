# BV-BRC Orchestrator — Agent Registry Configuration
#
# Agents run in-process by default (protocol: inprocess). The orchestrator
# imports and calls run_agent() directly — no MCP HTTP hop.
#
# To roll back to MCP RPC: set protocol: "mcp", restore endpoint,
# chat_tool, and mcp_server_name, and start the MCP server with
# ENABLE_AGENT_CHAT_MCP=1 so agent_chat is registered.
#
# AUTH: The BV-BRC token is still required for downstream APIs (Solr,
# workspace, GoWe). You can provide it via:
#   1. auth_token_env in the config (reads from an environment variable)
#   2. --token flag on the CLI scripts
#   3. BV_BRC_AUTH_TOKEN environment variable (global fallback)

agents:
  data:
    name: "Data Agent"
    description: >
      Retrieves biological data from BV-BRC. Translates natural language
      questions into Solr queries against genome, feature, AMR, pathway,
      epitope, and other BV-BRC collections. Returns structured data results
      including counts, facets, and tabular data.
    protocol: "inprocess"
    capabilities:
      - data_retrieval
      - solr_query
      - faceted_search
      - collection_browsing
    max_iterations: 1000
    timeout_seconds: 300
    auth_token_env: "BV_BRC_AUTH_TOKEN"
    chat_tool_params:
      agent_type: "data"
    # D1 (2026-10-13): thinking off (Qwen only). Measured: 16/16 graded questions
    # still pass, slowest 114 s -> 24 s. current_plans/user_testing_solutions.md D1.
    disable_thinking: true

  service:
    name: "Service Agent"
    description: >
      Constructs BV-BRC bioinformatics service workflows. Takes natural
      language descriptions of analyses and builds validated workflow plans
      for genome assembly, annotation, BLAST, phylogenetics, and 30+ other
      BV-BRC services. Returns workflow configurations for user review.
      Handles multi-step pipelines with dependencies between services.
    protocol: "inprocess"
    capabilities:
      - workflow_planning
      - service_configuration
      - parameter_validation
      - multi_step_pipelines
      - similar_genome_finder
    max_iterations: 1000
    timeout_seconds: 300
    auth_token_env: "BV_BRC_AUTH_TOKEN"
    chat_tool_params:
      agent_type: "service"
    # D1 (2026-10-13): thinking off for the intent classifier only; the populate loop keeps it.
    disable_thinking_classifier: true

  workspace:
    name: "Workspace Agent"
    description: >
      Explores the user's BV-BRC cloud workspace (personal file system).
      Browses directories, searches for files by name/type/extension,
      retrieves file metadata, and previews file contents. Returns both
      a natural language summary and structured data (file listings,
      metadata, UI grid payloads) for rich rendering. Read-only -- does
      not create, modify, or delete files.
    protocol: "inprocess"
    capabilities:
      - workspace_browsing
      - file_search
      - file_metadata
      - file_preview
    max_iterations: 1000
    timeout_seconds: 300
    auth_token_env: "BV_BRC_AUTH_TOKEN"
    chat_tool_params:
      agent_type: "workspace"
    # D1 (2026-10-13): thinking stays on; with it off this agent regressed
    # (helpdesk skipped query_helpdesk; workspace lost the task). Analysis not measured.
    disable_thinking: false

  helpdesk:
    name: "Helpdesk Agent"
    description: >
      Answers questions about how to use BV-BRC. Searches the helpdesk
      knowledge base (FAQs, tutorials, guides, documentation) to provide
      grounded answers about platform features, service usage, parameter
      explanations, troubleshooting, and best practices. Can also look up
      service parameter schemas for detailed configuration guidance.
      Read-only -- does not run, submit, or execute any jobs.
    protocol: "inprocess"
    capabilities:
      - helpdesk_guidance
      - service_documentation
      - faq_answers
      - platform_usage
      - troubleshooting
    max_iterations: 1000
    timeout_seconds: 300
    auth_token_env: "BV_BRC_AUTH_TOKEN"
    chat_tool_params:
      agent_type: "helpdesk"
    # D1 (2026-10-13): thinking stays on; with it off this agent regressed
    # (helpdesk skipped query_helpdesk; workspace lost the task). Analysis not measured.
    disable_thinking: false

  analysis:
    name: "Analysis Agent"
    description: >
      Analyzes output files from completed BV-BRC service jobs. Browses
      job output directories, reads key result files (reports, tables,
      sequences), and extracts service-specific metrics (assembly N50,
      gene counts, BLAST hits, variant counts, etc.). Returns both a
      natural language summary and structured data (file listings,
      metrics, report links) for rich UI rendering.
    protocol: "inprocess"
    capabilities:
      - output_analysis
      - metric_extraction
      - result_summarization
      - workspace_browsing
    max_iterations: 1000
    timeout_seconds: 300
    auth_token_env: "BV_BRC_AUTH_TOKEN"
    chat_tool_params:
      agent_type: "analysis"
    # D1 (2026-10-13): thinking stays on; with it off this agent regressed
    # (helpdesk skipped query_helpdesk; workspace lost the task). Analysis not measured.
    disable_thinking: false

  planning:
    name: "Planning Agent"
    description: >
      Handles complex, multi-step questions that require coordinating
      multiple agents. Creates step-by-step plans for experiment design,
      multi-stage analysis, or any request that needs data retrieval,
      service execution, and workspace operations in sequence. Asks
      clarification questions when the request is ambiguous. Plans are
      presented to the user for review and editing before execution.
      Do NOT route simple single-agent questions here.
    protocol: "inprocess"
    capabilities:
      - multi_step_planning
      - experiment_design
      - task_decomposition
      - clarification
    max_iterations: 1000
    timeout_seconds: 300
    auth_token_env: "BV_BRC_AUTH_TOKEN"
    chat_tool_params:
      agent_type: "planning"

# Orchestrator-level settings
orchestrator:
  mcp_connect_timeout: 10
  mcp_request_timeout: 120
  health_check_interval: 60
  auto_discover: true

  # Dedicated model for routing decisions.  Routing is an internal JSON
  # classification task — it always uses this model regardless of what
  # model the user selects for their conversation.  This prevents routing
  # failures when the user's model struggles with structured JSON output.
  # 2026-10-09: Qwen3.8-27B on mango:8008 (Qwen3.6 on :8004 was taken down).
  # Previously "Qwen/Qwen3.6-35B-A3B" at http://mango.cels.anl.gov:8004/v1.
  routing_model: "Qwen3.8-27B"
  routing_base_url: "http://mango.cels.anl.gov:8008/v1"
  routing_api_key: "not-needed"

  # Routing is a constrained classification, not a reasoning task.
  #
  # routing_disable_thinking: sends chat_template_kwargs.enable_thinking=false.
  #   Qwen-family models otherwise spend the whole budget on a <think> block
  #   that the router strips anyway (and return content=None when the budget
  #   runs out, forcing the retry). Measured on mango 2026-10-05: 200+ tokens
  #   and content=None with thinking on, 47-81 tokens with it off.
  # routing_structured_output: constrains the reply via response_format to the
  #   routing JSON schema. Without it the model invented the keys
  #   {agent, action, parameters}; with it the reply carried exactly
  #   {decision, reasoning, agent_key}.
  #   NOTE: guided_json is accepted but silently IGNORED by this vLLM build.
  # routing_max_tokens: replaces the hard-coded 16384 in router.py. A
  #   constrained decision needs a few hundred; the headroom is for
  #   direct_response prose.
  #
  # Set either flag to false if you swap in a model that rejects these
  # parameters, then restart the orchestrator.
  routing_disable_thinking: true
  routing_structured_output: true
  routing_max_tokens: 2048

  # Hosts a request's llm_override.base_url may point at (hostname only,
  # any port). The model list in Mongo supplies base_url per request; without
  # this allowlist any caller could aim the agents at a server it controls.
  # Add a host here (and restart) before activating a modelList row on it.
  # GoWe server the agents submit jobs to and read workflows from. Required:
  # the orchestrator refuses to start without it. GOWE_URL in the environment
  # overrides it (production on elm: http://127.0.0.1:7000). The gateway's
  # job monitor has its own setting (config.json workflow_monitor.gowe_url);
  # the two must point at the same server.
  gowe_url: "http://140.221.78.67:12007"

  llm_allowed_hosts:
    - "mango.cels.anl.gov"    # vLLM: Qwen, Llama 4 Scout
    - "apps.inside.anl.gov"   # Argo
    - "rbdgx2.cels.anl.gov"   # Llama 3.3 70B (inactive row)
